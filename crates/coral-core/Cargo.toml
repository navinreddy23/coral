[package]
name = "coral-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tokio     = { workspace = true, features = ["rt", "process", "io-util", "sync", "time", "macros", "fs"] }
bstr      = { workspace = true }
smallvec  = { workspace = true }
serde     = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
getrandom  = { workspace = true }
secrecy   = { workspace = true }
tracing   = { workspace = true }
gix       = { workspace = true, features = ["max-performance"] }
notify    = { workspace = true }
tempfile  = { workspace = true }
ts-rs     = { workspace = true, optional = true }

# One keyring backend per platform, rather than every backend on every platform.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["zbus-secret-service-keyring-store"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native-keyring-store"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native-keyring-store"] }

[dev-dependencies]
tokio    = { workspace = true, features = ["rt-multi-thread", "macros"] }
insta    = { workspace = true }
tempfile = { workspace = true }

[features]
# Lets coral-cli's snapshot tests build fixture repos with the same hermetic builder.
testutil = []
# Emits ui/src/ipc/types.ts during `cargo test`. Lives here rather than in coral-app so the
# bindings can be generated without the Tauri crate's system dependencies.
ts = ["dep:ts-rs"]

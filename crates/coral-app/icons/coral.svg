<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Coral</title>
  <!--
    One commit, the two branches that leave it, and the trunk carrying on past them. It is a
    commit graph and it is a piece of coral, which is the whole idea: a thing that grows by
    branching.

    Four nodes rather than three. Three made a Y, and a Y is the shape every client already
    uses for a branch — including this one, in `ui/src/app/icon.ts`, which is exactly the
    glyph the application's own mark must not be mistaken for.

    An application icon is read at sixteen pixels far more often than at five hundred, so
    nothing here is finer than a node: the strokes are the width of one, and the nodes are
    spaced further apart than they need to be at this size so they stay apart at that one.

    Drawn here rather than fetched, so there is nobody to credit and nothing to license. The
    PNG, ICO and ICNS beside it are generated from this file by `cargo tauri icon`, and the
    same shape is drawn live by `ui/src/app/Mark.svelte` and by the boot screen in
    `ui/index.html`.
  -->
  <defs>
    <linearGradient id="reef" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1b2430" />
      <stop offset="1" stop-color="#0b1016" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" ry="112" fill="url(#reef)" />

  <g fill="none" stroke="#ff8f5a" stroke-width="42" stroke-linecap="round">
    <path d="M256 448 V299" />
    <path d="M256 299 V85" />
    <path d="M256 299 C256 235 203 214 139 180" />
    <path d="M256 299 C256 235 309 214 373 180" />
  </g>
  <g fill="#ff8f5a">
    <circle cx="256" cy="448" r="46" />
    <circle cx="256" cy="77" r="46" />
    <circle cx="128" cy="171" r="46" />
    <circle cx="384" cy="171" r="46" />
  </g>
</svg>

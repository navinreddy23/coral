[package]
name = "coral-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
coral-core = { workspace = true }
# Deliberately no "tracing" feature: Tauri's IPC spans serialize raw request and response
# bodies, which would turn every binary graph chunk into a multi-megabyte debug string.
tauri      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
coral-core = { workspace = true, features = ["testutil"] }

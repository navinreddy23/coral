[package]
name = "coral-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "coral_app_lib"
path = "src/lib.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
coral-core    = { workspace = true }
coral-hosting = { workspace = true }
secrecy       = { workspace = true }
gix        = { workspace = true }
# Deliberately no "tracing" feature: Tauri's IPC spans serialize raw request and response
# bodies, which would turn every binary graph chunk into a multi-megabyte debug string.
tauri      = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
portable-pty = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
coral-core = { workspace = true, features = ["testutil"] }
tempfile   = { workspace = true }
tokio      = { workspace = true, features = ["rt-multi-thread", "macros"] }

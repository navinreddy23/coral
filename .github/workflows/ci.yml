name: CI

on:
  push:
  pull_request:

# A second push supersedes the first rather than leaving three runners finishing work nobody
# is waiting for any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: cd ui && npm ci

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # --no-fail-fast because cargo otherwise stops at the first test binary that fails,
      # and on a platform nobody develops on that means one fault per run and a round trip
      # of a quarter of an hour to find the next.
      - run: cargo test --workspace --all-features --no-fail-fast

      # ts-rs regenerates types.ts during the test run above; it must not have changed.
      - name: Generated bindings are up to date
        run: git diff --exit-code -- ui/src/ipc/types.ts

      - run: cd ui && npm run check
      - run: cd ui && npm test
      - run: cd ui && npm run build

      # The two guards `just ui-check` runs after the build. Both faults appear only at runtime,
      # so the built output is searched for them: Svelte's server entry opens a blank window, and
      # the preview fixtures have shipped in a release once already. The build is the same on all
      # three platforms, so once is enough.
      - name: The built interface carries neither the server entry nor the fixtures
        if: runner.os == 'Linux'
        working-directory: ui
        run: |
          ! grep -rql "is not available on the server" dist/assets
          ! grep -rql "Ada Lovelace" dist/assets

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --locked
      # cargo-about keeps its binary behind a `cli` feature that is not on by default.
      # Without it cargo installs no binary, says so in a warning, and still exits 0, so
      # the miss only shows up as `no such command: about` further down.
      - run: cargo install cargo-about --locked --features cli
      - run: cargo deny check
      - name: THIRD_PARTY_LICENSES.md is up to date
        run: |
          cargo about generate about.hbs > THIRD_PARTY_LICENSES.md
          git diff --exit-code -- THIRD_PARTY_LICENSES.md

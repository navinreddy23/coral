name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: cd ui && npm ci

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

      # ts-rs regenerates types.ts during the test run above; it must not have changed.
      - name: Generated bindings are up to date
        run: git diff --exit-code -- ui/src/ipc/types.ts

      - run: cd ui && npm run check
      - run: cd ui && npm test
      - run: cd ui && npm run build

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny cargo-about --locked
      - run: cargo deny check
      - name: THIRD_PARTY_LICENSES.md is up to date
        run: |
          cargo about generate about.hbs > THIRD_PARTY_LICENSES.md
          git diff --exit-code -- THIRD_PARTY_LICENSES.md

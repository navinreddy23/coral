<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coral</title>
    <!--
      Written here rather than in the stylesheet, because the stylesheet arrives with the
      bundle and this has to be true before it does. Until then a webview paints its own
      white, and the window opened as a white rectangle for as long as the bundle took to
      load. The values are `--bg-1`, `--fg-2` and `--accent` from tokens.css, copied because
      nothing that could read the tokens has loaded yet.

      Coral's own theme is an explicit choice kept in the page's storage, which cannot be read
      before the bundle either — an inline script would do it and the content policy refuses
      one. The desktop's preference is the best guess available without either, and it is the
      right guess for anyone whose two settings agree. Somebody running a dark desktop and a
      light Coral gets a dark half second, which is the price of the dark desktop and a dark
      Coral not getting a light one.
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #f5f7fa; }

      #boot {
        position: fixed; inset: 0; display: flex; gap: 14px;
        align-items: center; justify-content: center;
        font: 600 13px/1 'Inter Variable', Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-transform: uppercase; color: #4a5566;
      }

      /* Coral's own mark, drawn rather than a dot: this is the first thing the window shows,
         and it is the same shape the title bar carries a moment later. */
      #boot svg { color: #e0533b; flex: 0 0 auto; }
      #boot svg circle { animation: boot-node 1600ms ease-in-out infinite; }
      #boot svg circle:nth-of-type(2) { animation-delay: 200ms; }
      #boot svg circle:nth-of-type(3) { animation-delay: 400ms; }
      #boot svg circle:nth-of-type(4) { animation-delay: 600ms; }

      /* Settling from wide to set, so the word arrives rather than appearing. */
      #boot b { font-weight: 600; animation: boot-word 900ms ease-out both; }

      @keyframes boot-node {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @keyframes boot-word {
        from { letter-spacing: 0.5em; opacity: 0; }
        to { letter-spacing: 0.22em; opacity: 1; }
      }

      @media (prefers-color-scheme: dark) {
        html, body { background: #0e1116; }
        #boot { color: #9ea8b7; }
        #boot svg { color: #ff8f5a; }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot svg circle { animation: none; }
        #boot b { animation: none; letter-spacing: 0.22em; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- Removed by main.ts the moment the application mounts over it. -->
    <div id="boot">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <path d="M12 22v-8" /><path d="M12 14V4" />
        <path d="M12 14c0-3-2.5-3.6-5.5-5.2" /><path d="M12 14c0-3 2.5-3.6 5.5-5.2" />
        <circle cx="12" cy="22" r="2.3" fill="currentColor" stroke="none" />
        <circle cx="12" cy="3.6" r="2.3" fill="currentColor" stroke="none" />
        <circle cx="6" cy="8" r="2.3" fill="currentColor" stroke="none" />
        <circle cx="18" cy="8" r="2.3" fill="currentColor" stroke="none" />
      </svg>
      <b>Coral</b>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
